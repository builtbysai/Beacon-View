# MonitorHome (MonitorUi.kt) is one ~1,300-line composable; Kotlin's data-flow
# analysis of it needs more than 2 GB. CI runs lint and the release build in
# separate Gradle invocations so two analyses never share this heap (6 GB
# plus the Kotlin daemon exhausted the runner). Follow-up: split MonitorHome
# into per-page composables, then lower this.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
