# MonitorHome (MonitorUi.kt) is one ~1,300-line composable; Kotlin data-flow
# analysis of it needs >4 GB when compile and two lint passes share the
# daemon (2 GB and 4 GB both ran out of memory in CI). Follow-up: split
# MonitorHome into per-page composables, then lower this.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
