name: beacon-secureview-cloud

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: &bounded-logs
      driver: local
      options:
        max-file: '3'
        max-size: 10m
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/cloud/Dockerfile.backend
    entrypoint: []
    working_dir: /app/apps/backend
    command:
      [
        '/app/apps/backend/node_modules/.bin/drizzle-kit',
        'migrate',
        '--config',
        'drizzle.config.ts',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-environment
      ALLOW_INSECURE_LOCAL_DEV: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEVICE_STUN_URL: stun:${TURN_EXTERNAL_IP}:3478
      DEVICE_TURN_TCP_URL: turn:${TURN_EXTERNAL_IP}:3478?transport=tcp
      DEVICE_TURN_URL: turn:${TURN_EXTERNAL_IP}:3478?transport=udp
      HOST: 0.0.0.0
      # Caddy is the only proxy in front of the backend and connects from the
      # compose network's private range (F1).
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      ICE_TRANSPORT_POLICY: all
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:-}
      RECORDING_ENCRYPTION_KEY: ${RECORDING_ENCRYPTION_KEY:-}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      LOG_LEVEL: info
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
      NOTIFICATION_FINGERPRINT_KEY: ${NOTIFICATION_FINGERPRINT_KEY:-}
      CAST_APP_ID: ${CAST_APP_ID:-}
      NOTIFICATION_OFFLINE_GRACE_SECONDS: ${NOTIFICATION_OFFLINE_GRACE_SECONDS:-120}
      NODE_ENV: production
      PUBLIC_BACKEND_ORIGIN: https://${BEACON_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SIGNALING_PUBLIC_URL: wss://${BEACON_DOMAIN}/api/signaling
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      VIEWER_STUN_URL: stun:${TURN_EXTERNAL_IP}:3478
      VIEWER_TURN_TCP_URL: turn:${TURN_EXTERNAL_IP}:3478?transport=tcp
      VIEWER_TURN_URL: turn:${TURN_EXTERNAL_IP}:3478?transport=udp
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_ORIGIN: https://${BEACON_DOMAIN}
    restart: 'no'
    logging: *bounded-logs

  migrate-verify:
    build:
      context: ../..
      dockerfile: infrastructure/cloud/Dockerfile.backend
    entrypoint: []
    working_dir: /app/apps/backend
    command: ['node', 'scripts/verify-migration-schema.mjs']
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-environment
    restart: 'no'
    logging: *bounded-logs

  backup:
    build:
      context: ../..
      dockerfile: infrastructure/cloud/Dockerfile.backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${OCI_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      AWS_DEFAULT_REGION: ${OCI_OBJECT_STORAGE_REGION:-}
      AWS_SECRET_ACCESS_KEY: ${OCI_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      RESTIC_REPOSITORY: ${OCI_OBJECT_STORAGE_REPOSITORY:-}
    restart: 'no'
    logging: *bounded-logs

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/cloud/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-environment
    restart: unless-stopped
    logging: *bounded-logs

  coturn:
    image: coturn/coturn:4.6.3-r3
    command:
      [
        '-c',
        '/etc/coturn/turnserver.conf',
        '--external-ip=${TURN_EXTERNAL_IP}',
        '--realm=${BEACON_DOMAIN}',
        '--server-name=${BEACON_DOMAIN}',
        '--static-auth-secret=${TURN_SHARED_SECRET}',
      ]
    ports:
      - '3478:3478/tcp'
      - '3478:3478/udp'
      - '49160-49200:49160-49200/tcp'
      - '49160-49200:49160-49200/udp'
    restart: unless-stopped
    logging: *bounded-logs
    volumes:
      - ../cloud/turnserver.conf:/etc/coturn/turnserver.conf:ro

  web:
    build:
      context: ../..
      dockerfile: infrastructure/cloud/Dockerfile.web
    depends_on:
      - backend
    environment:
      BEACON_DOMAIN: ${BEACON_DOMAIN}
    networks: [default, edge]
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    logging: *bounded-logs
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Published desktop installers (ADR 0083); see apps/desktop/README.md.
      - /opt/beacon/downloads:/srv/downloads:ro
      # Non-secret, root-owned hostname routes for independently deployed products.
      - /etc/beacon/products:/etc/caddy/products:ro

networks:
  edge:
    name: beacon-edge

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
