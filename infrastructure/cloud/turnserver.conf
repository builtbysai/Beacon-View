# Non-secret cloud TURN settings. Secrets and the public address are supplied at runtime.
listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49200
fingerprint
no-cli
no-multicast-peers
stale-nonce=600
no-tlsv1
no-tlsv1_1

# The relay must never reach this VM's own network (F3): the backend,
# PostgreSQL and the host's other services sit on private addresses. Browsers
# and phones only ever need public peer addresses through a relay.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# One household's cameras and viewers need a handful of relays at once; these
# limits keep a leaked or abused credential from exhausting the VM's relay
# ports (49160-49200) and bandwidth.
user-quota=10
total-quota=40
max-bps=4000000
