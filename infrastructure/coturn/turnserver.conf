# Local development only. Replace every credential and enable TLS before deployment.
listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49200
realm=beacon.local
server-name=beacon.local
use-auth-secret
static-auth-secret=local-development-turn-shared-secret
fingerprint
no-cli
no-multicast-peers
no-loopback-peers
stale-nonce=600
verbose
