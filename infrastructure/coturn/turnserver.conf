# Local development only. Replace every credential and enable TLS before deployment.
listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49200
realm=beacon.local
server-name=beacon.local
use-auth-secret
# Compose supplies the selected development secret; no credential is embedded here.
fingerprint
no-cli
no-multicast-peers
stale-nonce=600
verbose
