name: beacon-secureview-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: beacon_secureview
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: beacon_local
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beacon_local -d beacon_secureview']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3-r3
    command: ['-c', '/etc/coturn/turnserver.conf']
    ports:
      - '127.0.0.1:3478:3478/tcp'
      - '127.0.0.1:3478:3478/udp'
      - '127.0.0.1:49160-49200:49160-49200/udp'
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

  secure-proxy:
    profiles: ['secure']
    image: caddy:2.10.2-alpine
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${BEACON_HTTPS_BIND:-127.0.0.1}:8443:8443'
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
