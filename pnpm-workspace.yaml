packages:
  - apps/backend
  - apps/desktop
  - apps/web-viewer
  - packages/*

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true

# Patched versions of transitive development and build tools (V16). Production
# dependencies are already clean in `pnpm audit --prod`.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'undici@>=7.0.0 <7.30.0': 7.30.0
  'esbuild@<0.28.1': 0.28.2
