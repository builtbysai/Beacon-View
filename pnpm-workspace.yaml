packages:
  - apps/backend
  - apps/desktop
  - apps/web-viewer
  - packages/*

# Keep dependency directories local and movable; never junction into another checkout.
nodeLinker: hoisted
packageImportMethod: copy
injectWorkspacePackages: true
dedupeInjectedDeps: false
syncInjectedDepsAfterScripts:
  - build
  - typecheck
  - test
  - dev

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true

# Patched versions of transitive development and build tools (V16). Production
# dependencies are already clean in `pnpm audit --prod`.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'esbuild@<0.28.1': 0.28.2
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fast-uri@>=4.0.0 <4.2.3': 4.2.3
