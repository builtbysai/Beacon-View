name: Deploy Beacon to Oracle

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: beacon-web-production
  cancel-in-progress: false

jobs:
  deploy:
    # Off unless the repository variable BEACON_AUTO_DEPLOY is 'true' (ADR 0106:
    # production deployments are manual). The file used to rely on the workflow
    # being disabled in the GitHub UI, which nothing in the repository showed.
    if: >-
      vars.BEACON_AUTO_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://beacon.builtbysai.com/
    timeout-minutes: 20
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Connect to the private deployment network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: beacon-secureview-oracle

      - name: Create a source archive
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git archive --format=tar.gz --output="beacon-${RELEASE_SHA}.tar.gz" "$RELEASE_SHA"

      - name: Configure SSH trust
        shell: bash
        env:
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/beacon-ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/beacon-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/beacon-ssh/id_ed25519"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$RUNNER_TEMP/beacon-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/beacon-ssh/known_hosts"

      - name: Upload the validated source
        shell: bash
        env:
          ORACLE_HOST: beacon-secureview-oracle
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          scp
          -i "$RUNNER_TEMP/beacon-ssh/id_ed25519"
          -o HostKeyAlias=129.213.128.206
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$RUNNER_TEMP/beacon-ssh/known_hosts"
          "beacon-${RELEASE_SHA}.tar.gz"
          "${ORACLE_USER}@${ORACLE_HOST}:/tmp/beacon-${RELEASE_SHA}.tar.gz"

      - name: Apply migrations, deploy backend and web, and verify readiness
        shell: bash
        env:
          ORACLE_HOST: beacon-secureview-oracle
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/beacon-ssh/id_ed25519" \
            -o HostKeyAlias=129.213.128.206 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/beacon-ssh/known_hosts" \
            "${ORACLE_USER}@${ORACLE_HOST}" \
            "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          archive="/tmp/beacon-${RELEASE_SHA}.tar.gz"
          release_dir="/opt/beacon/releases/web-${RELEASE_SHA}"
          compose_file="${release_dir}/infrastructure/cloud/compose.yaml"
          env_files=(--env-file /etc/beacon/production.env --env-file /etc/beacon/backup.env)

          sudo install -d -m 0755 "$release_dir"
          sudo tar --extract --gzip --file "$archive" --directory "$release_dir"
          rm -f "$archive"

          sudo docker compose \
            --project-name beacon-secureview-cloud \
            "${env_files[@]}" \
            --file "$compose_file" \
            build backend migrate migrate-verify web
          sudo docker compose \
            --project-name beacon-secureview-cloud \
            "${env_files[@]}" \
            --file "$compose_file" \
            up -d postgres
          sudo docker compose \
            --project-name beacon-secureview-cloud \
            "${env_files[@]}" \
            --file "$compose_file" \
            run --rm --interactive=false migrate
          sudo docker compose \
            --project-name beacon-secureview-cloud \
            "${env_files[@]}" \
            --file "$compose_file" \
            run --rm --interactive=false migrate-verify
          sudo docker compose \
            --project-name beacon-secureview-cloud \
            "${env_files[@]}" \
            --file "$compose_file" \
            up -d --no-deps backend web

          domain="${BEACON_DOMAIN:-beacon.builtbysai.com}"
          # --retry-all-errors is required here: a freshly (re)started Caddy
          # can briefly reject the TLS handshake (curl exit 35,
          # SSL_ERROR_SYSCALL) before it's done initializing. Plain --retry
          # only covers curl's "transient" error set (timeouts, 5xx, etc.)
          # and does NOT retry on SSL connect errors, so without this flag
          # a single early handshake failure fails the whole deploy even
          # though the service comes up moments later.
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --resolve "${domain}:443:127.0.0.1" \
            "https://${domain}/health" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --resolve "${domain}:443:127.0.0.1" \
            "https://${domain}/ready" > /dev/null
          REMOTE_SCRIPT
