name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR (a fixup, a rebase, a force-push) makes any run
# already in flight for it moot -- only the latest push's result matters.
# Without this, every push kept its predecessor running to completion,
# multiplying Actions usage on exactly the branches that get pushed to most.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI never launches Electron (the desktop unit tests are Electron-free), so
# skip its ~100 MB runtime download on every install.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  # A docs-only or single-app change doesn't need the whole matrix: android
  # and database are this workflow's two most expensive jobs (a full Gradle
  # build/test/lint/assembleRelease, and a Postgres-backed migration/
  # integration suite), and previously ran unconditionally on every push --
  # including changes that could not possibly affect either of them. This
  # job decides, from the actual diff, whether each is worth running.
  # `validate` (lint/typecheck/test/build/format, including markdown) and
  # `secrets`/`sbom` stay unconditional: they're comparatively cheap and are
  # exactly the checks a docs-only change still benefits from.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A brand-new branch, a force-pushed history rewrite, or the
          # repository's very first push all leave no usable base commit to
          # diff against -- run everything rather than guess.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base commit for a diff -- running the full matrix."
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "database=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files ($base..$head):"
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/android-camera/|\.github/workflows/)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(apps/backend/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/)'; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install the locked dependency graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: beacon-secureview.cdx.json
          upload-artifact: false
      - name: Retain SBOM with this CI run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beacon-secureview-cyclonedx-sbom
          path: beacon-secureview.cdx.json
          if-no-files-found: error
          retention-days: 90

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: beacon_ci
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: beacon_secureview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon_ci -d beacon_secureview_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://beacon_ci:ci-only-test-password@127.0.0.1:5432/beacon_secureview_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration metadata
        run: pnpm --filter @beacon/backend db:check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Test migration schema contract extraction
        run: pnpm --filter @beacon/backend db:verify:parser
      - name: Migrate the clean disposable database
        run: pnpm --filter @beacon/backend db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Verify the migrated schema independently
        run: pnpm --filter @beacon/backend db:verify
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Verify migration reruns are safe
        run: pnpm --filter @beacon/backend db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run all backend tests including PostgreSQL integration
        run: pnpm --filter @beacon/backend test

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify the hosted Android SDK
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Test, lint, and compile Android without release signing
        run: >-
          bash apps/android-camera/gradlew -p apps/android-camera --no-daemon
          testDebugUnitTest lintDebug assembleDebug assembleRelease

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow syntax and shell commands
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci.yml
      - name: Scan history with fully redacted output
        run: >-
          docker run --rm --network none --read-only
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git /repo --redact=100 --no-banner
